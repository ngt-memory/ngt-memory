# ─────────────────────────────────────────────────────────────────────
# NGT Memory API — docker-compose (v0.24.0)
#
# Профили (docker compose --profile <name> up):
#   (без профиля)  — одиночный воркер, in-memory backend, персистентность на диск
#   redis          — multi-worker через Redis backend (+ сервис redis)
#   metrics        — добавляет Prometheus, скрапящий /metrics
#
# Примеры:
#   docker compose up                      # self-hosted, 1 воркер
#   docker compose --profile redis up      # multi-worker + redis
#   docker compose --profile metrics up    # + prometheus
# ─────────────────────────────────────────────────────────────────────

services:
  ngt-memory-api:
    build: .
    container_name: ngt-memory-api
    env_file:
      - .env
    environment:
      - NGT_CHAT_MODEL=${NGT_CHAT_MODEL:-gpt-4.1-nano}
      - NGT_EMBEDDING_MODEL=${NGT_EMBEDDING_MODEL:-text-embedding-3-small}
      - NGT_MEMORY_TOP_K=${NGT_MEMORY_TOP_K:-5}
      - NGT_MEMORY_THRESHOLD=${NGT_MEMORY_THRESHOLD:-0.25}
      - NGT_USE_GRAPH=${NGT_USE_GRAPH:-true}
      - NGT_SESSION_TTL=${NGT_SESSION_TTL:-3600}
      - NGT_MAX_SESSIONS=${NGT_MAX_SESSIONS:-100}
      - NGT_PERSIST_DIR=${NGT_PERSIST_DIR:-/data/sessions}
      - NGT_PERSIST_INTERVAL=${NGT_PERSIST_INTERVAL:-300}
      # ── Hardening v0.24.0 ──
      - NGT_SESSION_BACKEND=${NGT_SESSION_BACKEND:-memory}
      - NGT_WORKERS=${NGT_WORKERS:-1}
      - NGT_METRICS_ENABLED=${NGT_METRICS_ENABLED:-true}
      - NGT_RATE_LIMIT_RPS=${NGT_RATE_LIMIT_RPS:-0}
      - NGT_RATE_LIMIT_BURST=${NGT_RATE_LIMIT_BURST:-20}
      - NGT_MAX_TOTAL_ENTRIES=${NGT_MAX_TOTAL_ENTRIES:-200000}
      - NGT_MAX_TOTAL_MB=${NGT_MAX_TOTAL_MB:-2048}
    ports:
      - "9190:9190"
    volumes:
      - ngt-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9190/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
        required: false

  # ── Redis backend (профиль: redis) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ngt-memory-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Prometheus (профиль: metrics) ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ngt-memory-prometheus
    restart: unless-stopped
    profiles: ["metrics"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ngt-memory-api

volumes:
  ngt-data:

# ─────────────────────────────────────────────────────────────────────
# Для multi-worker деплоя добавьте в .env:
#   NGT_SESSION_BACKEND=redis
#   NGT_REDIS_URL=redis://ngt-memory-redis:6379/0   # имя сервиса, не localhost
#   NGT_WORKERS=4
# и запускайте с --profile redis.
# ─────────────────────────────────────────────────────────────────────
